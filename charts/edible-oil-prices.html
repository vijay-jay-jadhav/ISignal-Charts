<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edible oil prices</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;700&family=Fira+Sans+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#f7f4f3; }
  .vis-edible-oil-prices { max-width:700px; margin:0 auto; padding:24px; background:#f7f4f3; }
  .vis-edible-oil-prices * { box-sizing:border-box; font-family:'Fira Sans', sans-serif; }
  .vis-edible-oil-prices .eyebrow { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .vis-edible-oil-prices .eyebrow .tick { width:18px; height:3px; background:#e27a36; }
  .vis-edible-oil-prices .eyebrow span { font-size:11px; font-weight:700; color:#e27a36; text-transform:uppercase; letter-spacing:0.08em; font-family:'Fira Sans Condensed', sans-serif; }
  .vis-edible-oil-prices h1 { font-size:34px; font-weight:700; color:#262626; margin:0 0 16px; line-height:1.15; }
  .vis-edible-oil-prices .legend { display:flex; flex-wrap:wrap; gap:8px 20px; margin:0 0 12px; }
  .vis-edible-oil-prices .legend div { display:flex; align-items:center; gap:8px; font-family:'Fira Sans Condensed', sans-serif; font-weight:700; font-size:15px; color:#262626; }
  .vis-edible-oil-prices .sw-bar { width:14px; height:14px; background:#cfd3d8; }
  .vis-edible-oil-prices .sw-dot { width:10px; height:10px; border-radius:50%; background:#142157; }
  .vis-edible-oil-prices .foot { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:8px; }
  .vis-edible-oil-prices .src { font-size:12px; color:#898989; margin:0; line-height:1.5; }
  .vis-edible-oil-prices .src a { color:#898989; }
  @media (max-width:480px) {
    .vis-edible-oil-prices { padding:16px; }
    .vis-edible-oil-prices h1 { font-size:24px; }
    .vis-edible-oil-prices .legend div { font-size:13px; }
  }
</style>
</head>
<body>
<div class="vis-edible-oil-prices">
  <div class="eyebrow"><div class="tick"></div><span>ISignal Charts</span></div>
  <h1>Sunflower Oil Saw the Sharpest Annual Price Rise</h1>
  <div class="legend">
    <div><span class="sw-bar"></span>Sept 2026 price (Rs/kg)</div>
    <div><span class="sw-dot"></span>Change from Sept 2025 (%)</div>
  </div>
  <div style="position:relative;width:100%;"><canvas id="chart-edible-oil-prices"></canvas></div>
  <div class="foot">
    <p class="src"><strong>Source:</strong> <a href="https://foodprices.indiaspend.com" target="_blank" rel="noopener noreferrer">Food Price Watch</a></p>
    <a href="https://www.indiaspend.com/" target="_blank" rel="noopener noreferrer" style="flex-shrink:0; display:inline-block; line-height:0;">
      <img src="https://www.indiaspend.com/images/logo.svg?v=1" alt="IndiaSpend" style="height:24px; width:auto; display:block;">
    </a>
  </div>
</div>

<script>
(function () {
  var oils = [['Sunflower','oil'],['Palm','oil'],['Soya','oil'],['Groundnut','oil'],['Mustard','oil']];
  var price = [193.2, 152.2, 166.2, 208.9, 201.8];
  var yoy = [19.1, 15.1, 13.0, 11.2, 7.1];
  var NAVY = '#142157', BAR = '#cfd3d8';
  var FC = "'Fira Sans Condensed', sans-serif";
  function isMobile() { return window.innerWidth < 480; }
  function sizes() { var m = isMobile();
    return { tick: m ? 12 : 15, label: m ? 12 : 15, axisTitle: m ? 10 : 13, r: m ? 4 : 5, hr: m ? 6 : 7, line: m ? 2.5 : 3, aspect: m ? 1.1 : 1.8 }; }
  function fmt(v) { return v.toLocaleString('en-IN', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }

  var valueLabels = { id: 'valueLabels', afterDatasetsDraw: function (chart) {
    var s = sizes(), ctx = chart.ctx; ctx.save();
    ctx.font = '700 ' + s.label + 'px ' + FC; ctx.textAlign = 'center';
    // bar labels: inside the bar, near its base
    var bars = chart.getDatasetMeta(1), base = chart.scales.yPrice.getPixelForValue(0);
    ctx.fillStyle = '#262626'; ctx.textBaseline = 'bottom';
    bars.data.forEach(function (b, i) { ctx.fillText(fmt(price[i]), b.x, base - 6); });
    // line labels: above each point on a background pill
    var pts = chart.getDatasetMeta(0);
    ctx.textBaseline = 'middle';
    pts.data.forEach(function (p, i) {
      var t = fmt(yoy[i]) + '%', w = ctx.measureText(t).width + 10, h = s.label + 6;
      var y = p.y - (i === 0 ? s.hr : s.r) - 6 - h / 2;
      ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = '#f7f4f3'; ctx.strokeText(t, p.x, y);
      ctx.fillStyle = NAVY; ctx.fillText(t, p.x, y);
    });
    ctx.restore(); } };

  function build() {
    var s = sizes();
    var radii = yoy.map(function (_, i) { return i === 0 ? s.hr : s.r; });
    return new Chart(document.getElementById('chart-edible-oil-prices').getContext('2d'), {
      data: { labels: isMobile() ? oils.map(function (o) { return o[0]; }) : oils, datasets: [
        { type: 'line', data: yoy, yAxisID: 'yPct', order: 0, showLine: false, borderColor: NAVY, borderWidth: 0,
          pointBackgroundColor: NAVY, pointBorderWidth: 0, pointRadius: radii, pointHoverRadius: radii },
        { type: 'bar', data: price, yAxisID: 'yPrice', order: 1, backgroundColor: BAR, maxBarThickness: 72, categoryPercentage: 0.75, barPercentage: 0.9 }
      ]},
      options: { responsive: true, maintainAspectRatio: true, aspectRatio: s.aspect, animation: false, events: [],
        layout: { padding: { top: 10, right: 0, left: 0, bottom: 0 } },
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { offset: true, border: { color: '#262626' }, grid: { display: false },
               ticks: { autoSkip: false, maxRotation: 0, color: '#262626', font: { family: FC, size: s.tick } } },
          yPrice: { position: 'left', min: 0, max: 250, border: { display: false },
               grid: { color: 'rgba(0,0,0,0.06)', drawTicks: false },
               ticks: { stepSize: 50, padding: 4, color: '#262626', font: { family: FC, size: s.tick } },
               title: { display: true, text: 'Sept 2026 price (Rs/kg)', color: '#262626', padding: { top: 0, bottom: 2 },
                        font: { family: FC, size: s.axisTitle, weight: 700, lineHeight: 1 } } },
          yPct: { position: 'right', min: 0, max: 25, border: { display: false }, grid: { display: false, drawTicks: false },
               ticks: { stepSize: 5, padding: 4, color: '#262626', font: { family: FC, size: s.tick } },
               title: { display: true, text: 'Change from Sept 2025 (%)', color: '#262626', padding: { top: 0, bottom: 2 },
                        font: { family: FC, size: s.axisTitle, weight: 700, lineHeight: 1 } } }
        } },
      plugins: [valueLabels] });
  }
  function start() { var c = build(), wm = isMobile();
    window.addEventListener('resize', function () { if (isMobile() !== wm) { wm = isMobile(); c.destroy(); c = build(); } }); }
  function ready() { if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start(); }
  if (window.Chart) ready(); else {
    var ex = document.querySelector('script[data-chartjs]');
    if (ex) ex.addEventListener('load', ready); else {
      var sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
      sc.setAttribute('data-chartjs', '1'); sc.onload = ready; document.head.appendChild(sc); } }
})();
</script>
</body>
</html>
